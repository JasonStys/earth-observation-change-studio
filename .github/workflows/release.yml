# Draft-only portable publishing by Jason Stys. Exact-commit successful workflows gate each release.
name: Portable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: New version digits.digits.digits; creates a draft only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: portable-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Require passing exact-commit checks and new safe version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python tools/prepare_release.py
  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.14" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", package-manager-cache: false }
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
      - run: npm run build
      - run: python tools/package_app.py
      - name: Upload smoke-tested bundles directly to the draft, not Actions storage
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python tools/upload_release.py
